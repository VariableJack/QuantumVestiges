# General System/Spring values
server.address=0.0.0.0
server.port=80
server.max-http-header-size=32KB
logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=TRACE
# Application values
spring.application.name=QuantumVestiges
mybatis.mapper-locations=classpath:com/gamerparadise/dao/mapper/*.xml
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-west-2.amazonaws.com/
cors.allowed.origins=https://pre-prod.quantumvestiges.com

cognito.user_pool_id=us-west-2
s3.bucket.name.games=games-pre-prod
rds.secret=QuantumVestiges-pre-prod
# Liquibase
spring.liquibase.change-log=classpath:liquibase/config.xml
spring.liquibase.enabled=true